{% extends 'eventos/base.html' %}

{% block title %}Excluir evento{% endblock %}

{% block content %}
<div class="card shadow-sm border-danger" style="max-width: 540px;">
  <div class="card-body">
    <h1 class="h4 text-danger mb-3">Confirmar exclusão</h1>
    <p class="mb-4">Tem certeza de que deseja excluir o evento <strong>"{{ evento.nome_evento }}"</strong>?</p>

    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
      <a href="{% url 'evento_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
