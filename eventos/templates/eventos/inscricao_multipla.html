{% extends 'eventos/base.html' %}
{% block content %}
<h1>Inscrever participante em várias atividades</h1>
<form method="post">{% csrf_token %}
<p><select name="participante">
{% for p in participantes %}<option value="{{ p.pk }}">{{ p.nome_participante }}</option>{% endfor %}
</select></p>
{% for a in atividades %}
<label><input type="checkbox" name="atividades" value="{{ a.pk }}"> {{ a.titulo }}</label><br>
{% endfor %}
<p><button>Inscrever</button></p></form>
{% endblock %}
