{% extends 'eventos/base.html' %}

{% block title %}Inscrever participante{% endblock %}

{% block content %}
<div class="card shadow-sm" style="max-width: 600px;">
  <div class="card-body">
    <h1 class="h4 mb-1">Inscrever em atividade</h1>
    <p class="text-muted mb-4">
      Participante: <strong>{{ participante.nome_participante }}</strong> ({{ participante.cpf_participante }})
    </p>

    <form method="post">
      {% csrf_token %}
      {% if evento_id %}
        <input type="hidden" name="evento" value="{{ evento_id }}">
      {% endif %}

      <div class="mb-3">
        <label class="form-label">Atividade</label>
        <select name="atividade" class="form-select" required>
          {% for a in atividades %}
            <option value="{{ a.pk }}">
              {{ a.codigo_evento.nome_evento }} — {{ a.titulo }} ({{ a.carga_horaria }}h)
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label">Status inicial</label>
        <select name="status" class="form-select">
          <option value="Confirmada" selected>Confirmada</option>
          <option value="Pendente">Pendente</option>
        </select>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Confirmar inscrição</button>
        <a href="{% url 'participante_list' %}{% if evento_id %}?evento={{ evento_id }}{% endif %}" class="btn btn-outline-secondary">
  Cancelar
</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
